<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Draw + AI Guess</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #22d3ee;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #34d399;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(140deg, #020617, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(1050px, 100%);
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
    }

    .card {
      background: rgba(17, 24, 39, .9);
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(2, 6, 23, .4);
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, .35);
    }

    video, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #overlay {
      pointer-events: none;
    }

    #drawing {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, .35);
      background: #fff;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s ease;
      font-weight: 600;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .primary {
      border-color: #0e7490;
      background: rgba(6, 182, 212, .2);
      color: #a5f3fc;
    }

    h1 {
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      margin: 0 0 8px;
    }

    .muted { color: var(--muted); margin: 0 0 12px; }
    .status { font-weight: 700; }

    .pill {
      display: inline-block;
      margin: 6px 8px 0 0;
      padding: 7px 10px;
      border-radius: 999px;
      background: #1f2937;
      border: 1px solid #374151;
      font-size: .9rem;
    }

    .on { color: var(--success); border-color: rgba(52, 211, 153, .5); }
    .off { color: var(--danger); border-color: rgba(248, 113, 113, .5); }

    .guess {
      font-size: clamp(1.2rem, 2.6vw, 2rem);
      margin: 8px 0;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .hint {
      font-size: .9rem;
      color: var(--muted);
    }

    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>🖐️ Hand Movement Drawing Tracker</h1>
      <p class="muted">Pinch your <strong>index finger + thumb</strong> to draw in the white box. Release to stop. Then press “Guess drawing”.</p>

      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="row">
        <button id="startBtn" class="primary">Start Camera + Tracking</button>
        <button id="clearBtn">Clear Drawing</button>
      </div>

      <div>
        <span id="trackingState" class="pill off">Tracking: Off</span>
        <span id="drawingState" class="pill off">Drawing: Off</span>
      </div>
    </section>

    <section class="card">
      <h1>🎨 AI Guess</h1>
      <canvas id="drawing" width="320" height="320"></canvas>
      <div class="row">
        <button id="guessBtn" class="primary" disabled>Guess drawing</button>
      </div>
      <p class="guess" id="guessText">Model loading...</p>
      <p class="status" id="confidenceText"></p>
      <p class="hint">Tip: draw simple objects like cat, house, tree, smiley, sun, fish.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');

    const drawingCanvas = document.getElementById('drawing');
    const drawCtx = drawingCanvas.getContext('2d');

    const startBtn = document.getElementById('startBtn');
    const clearBtn = document.getElementById('clearBtn');
    const guessBtn = document.getElementById('guessBtn');

    const trackingState = document.getElementById('trackingState');
    const drawingState = document.getElementById('drawingState');

    const guessText = document.getElementById('guessText');
    const confidenceText = document.getElementById('confidenceText');

    let model;
    let isTracking = false;
    let isDrawing = false;
    let lastPoint = null;

    function initDrawingSurface() {
      drawCtx.fillStyle = '#ffffff';
      drawCtx.fillRect(0, 0, drawingCanvas.width, drawingCanvas.height);
      drawCtx.lineWidth = 12;
      drawCtx.lineCap = 'round';
      drawCtx.strokeStyle = '#000000';
    }

    function setPill(el, on, label) {
      el.classList.toggle('on', on);
      el.classList.toggle('off', !on);
      el.textContent = `${label}: ${on ? 'On' : 'Off'}`;
    }

    function drawLine(from, to) {
      drawCtx.beginPath();
      drawCtx.moveTo(from.x, from.y);
      drawCtx.lineTo(to.x, to.y);
      drawCtx.stroke();
    }

    function mapToDrawingCanvas(x, y, sourceWidth, sourceHeight) {
      const mirroredX = 1 - x;
      return {
        x: mirroredX * drawingCanvas.width,
        y: y * drawingCanvas.height,
      };
    }

    async function loadModel() {
      guessText.textContent = 'Loading DoodleNet model...';
      model = await ml5.imageClassifier('DoodleNet');
      guessText.textContent = 'Model ready. Draw and click "Guess drawing".';
      guessBtn.disabled = false;
    }

    function clearDrawing() {
      initDrawingSurface();
      guessText.textContent = 'Drawing cleared. Draw again!';
      confidenceText.textContent = '';
    }

    function handleHandResults(results) {
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;

      overlayCtx.save();
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: '#22d3ee', lineWidth: 3 });
        drawLandmarks(overlayCtx, landmarks, { color: '#f8fafc', lineWidth: 1, radius: 3 });

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        const pinchDistance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y, indexTip.z - thumbTip.z);
        const pinchThreshold = 0.06;
        const pinch = pinchDistance < pinchThreshold;

        const point = mapToDrawingCanvas(indexTip.x, indexTip.y, overlay.width, overlay.height);

        if (pinch) {
          if (!isDrawing) {
            isDrawing = true;
            lastPoint = point;
          } else if (lastPoint) {
            drawLine(lastPoint, point);
            lastPoint = point;
          }
        } else {
          isDrawing = false;
          lastPoint = null;
        }
      } else {
        isDrawing = false;
        lastPoint = null;
      }

      setPill(drawingState, isDrawing, 'Drawing');
      overlayCtx.restore();
    }

    async function startTracking() {
      if (isTracking) return;

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65,
      });

      hands.onResults(handleHandResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 960,
        height: 720,
      });

      await camera.start();
      isTracking = true;
      setPill(trackingState, true, 'Tracking');
      startBtn.disabled = true;
      startBtn.textContent = 'Tracking Started';
    }

    async function guessDrawing() {
      if (!model) {
        guessText.textContent = 'Model still loading...';
        return;
      }

      guessText.textContent = 'Thinking...';
      confidenceText.textContent = '';

      model.classify(drawingCanvas, (err, results) => {
        if (err) {
          guessText.textContent = 'Could not classify drawing.';
          confidenceText.textContent = 'Try drawing again.';
          return;
        }

        const best = results[0];
        const confidence = (best.confidence * 100).toFixed(1);
        guessText.textContent = `I think it is: ${best.label}`;
        confidenceText.textContent = `Confidence: ${confidence}%`;
      });
    }

    startBtn.addEventListener('click', startTracking);
    clearBtn.addEventListener('click', clearDrawing);
    guessBtn.addEventListener('click', guessDrawing);

    initDrawingSurface();
    loadModel();
  </script>
</body>
</html>
